{% extends "base.html" %}

{% block content %}

<h2>Course-wise Faculty Count</h2>

<table>
    <thead>
        <tr>
            <th>Course ID</th>
            <th>Course Name</th>
            <th>Department</th>
            <th>Faculty Count</th>
        </tr>
    </thead>

    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ course.course_id }}</td>
            <td>{{ course.course_name }}</td>
            <td>{{ course.dept_name }}</td>
            <td>{{ course.faculty_count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
