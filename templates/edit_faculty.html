{% extends "base.html" %}

{% block title %}
Edit Faculty
{% endblock %}

{% block content %}

<div class="page-container">


<h2>Edit Faculty</h2>

<div class="form-container">

    <form method="POST">

        <!-- CSRF Protection -->

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ faculty.name }}"
                maxlength="100"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ faculty.email }}"
                maxlength="100"
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ faculty.phone }}"
                maxlength="15"
            >

        </div>


        <div class="form-group">

            <label>Department</label>

            <select name="dept_id" required>

                {% for department in departments %}

                <option
                    value="{{ department.dept_id }}"
                    {% if department.dept_id == faculty.dept_id %}
                        selected
                    {% endif %}
                >
                    {{ department.dept_name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit">
            Update Faculty
        </button>

        <a href="{{ url_for('faculty') }}">
            Cancel
        </a>

    </form>

</div>


</div>

{% endblock %}
