{% extends "base.html" %}

{% block content %}

<h2>Exam-wise Student Count</h2>

<table>
    <thead>
        <tr>
            <th>Exam ID</th>
            <th>Exam Name</th>
            <th>Academic Year</th>
            <th>Semester</th>
            <th>Student Count</th>
        </tr>
    </thead>

    <tbody>
        {% for exam in exams %}
        <tr>
            <td>{{ exam.exam_id }}</td>
            <td>{{ exam.exam_name }}</td>
            <td>{{ exam.academic_year }}</td>
            <td>{{ exam.semester }}</td>
            <td>{{ exam.student_count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
