{% extends "base.html" %}

{% block title %}
Edit Course
{% endblock %}

{% block content %}

<div class="page-container">


<h2>Edit Course</h2>

<div class="form-container">

    <form method="POST">

        <!-- CSRF Protection -->

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="form-group">

            <label>Course Name</label>

            <input
                type="text"
                name="course_name"
                value="{{ course.course_name }}"
                maxlength="100"
                required
            >

        </div>


        <div class="form-group">

            <label>Duration (Years)</label>

            <input
                type="number"
                name="duration"
                value="{{ course.duration }}"
                min="1"
                max="10"
                required
            >

        </div>


        <div class="form-group">

            <label>Department</label>

            <select name="dept_id" required>

                {% for department in departments %}

                <option
                    value="{{ department.dept_id }}"
                    {% if department.dept_id == course.dept_id %}
                        selected
                    {% endif %}
                >
                    {{ department.dept_name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit">
            Update Course
        </button>

        <a href="{{ url_for('courses') }}">
            Cancel
        </a>

    </form>

</div>


</div>

{% endblock %}
