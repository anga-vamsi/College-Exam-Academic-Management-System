{% extends "base.html" %}

{% block content %}

<h2>Department-wise Faculty Count</h2>

<table>
    <thead>
        <tr>
            <th>Department ID</th>
            <th>Department Name</th>
            <th>Faculty Count</th>
        </tr>
    </thead>

    <tbody>
        {% for department in departments %}
        <tr>
            <td>{{ department.dept_id }}</td>
            <td>{{ department.dept_name }}</td>
            <td>{{ department.faculty_count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
