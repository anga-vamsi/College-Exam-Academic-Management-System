{% extends "base.html" %}

{% block title %}
Edit Attendance
{% endblock %}

{% block content %}

<div class="page-container">


<h2>Edit Attendance</h2>

<div class="form-container">

    <p>
        <strong>Student:</strong>
        {{ attendance.roll_no }} - {{ attendance.student_name }}
    </p>

    <p>
        <strong>Subject:</strong>
        {{ attendance.subject_code }} -
        {{ attendance.subject_name }}
    </p>


    <form method="POST">

        <!-- CSRF Protection -->

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="form-group">

            <label>Total Classes</label>

            <input
                type="number"
                name="total_classes"
                value="{{ attendance.total_classes }}"
                min="1"
                required
            >

        </div>


        <div class="form-group">

            <label>Attended Classes</label>

            <input
                type="number"
                name="attended_classes"
                value="{{ attendance.attended_classes }}"
                min="0"
                required
            >

        </div>


        <button type="submit">
            Update Attendance
        </button>

        <a href="{{ url_for('attendance') }}">
            Cancel
        </a>

    </form>

</div>


</div>

{% endblock %}
